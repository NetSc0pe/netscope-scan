[package]
name = "netscope-scan"
version = "0.1.0"
edition = "2018"
description = "Fast port scanner with JSON output"
license = "GPL-3.0-only"
keywords = ["port", "scanning", "network"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
colored = "3.1.1"
async-std = "1.13.2"
futures = "0.3"
rlimit = "0.11.0"
log = "0.4.29"
env_logger = "0.11.10"
dirs = "6.0.0"
gcd = "2.0.1"
rand = "0.10.0"
toml = "1.1.0"
serde = "1.0.124"
serde_derive = "1.0.116"
serde_json = "1.0"
cidr-utils = "0.6.2"
itertools = "0.14.0"
hickory-resolver = { version = "0.24.3", features = ["dns-over-rustls"] }
once_cell = "1.21.4"

[dev-dependencies]
parameterized = "2.0.0"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[[bin]]
name = "netscope-scan"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
